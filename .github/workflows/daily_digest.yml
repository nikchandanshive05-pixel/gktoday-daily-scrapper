name: Daily UPSC & MPSC Digest & Compendium Engine

on:
  schedule:
    # Runs daily at 00:30 UTC (06:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Sources to scrape (hindu,express,loksatta,gktoday,pib or all)'
        required: false
        default: 'all'
      pdf_engine:
        description: 'PDF generation engine (typst, reportlab, or both)'
        required: false
        default: 'typst'
      force:
        description: 'Ignore dedup cache and force run'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-digest-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Typst CLI
        uses: taiki-e/install-action@v2
        with:
          tool: typst

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Compendium Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python main.py \
            --sources "${{ github.event.inputs.sources || 'all' }}" \
            --pdf-engine "${{ github.event.inputs.pdf_engine || 'typst' }}" \
            $FORCE_FLAG

      - name: Upload Daily Digest Compendium & Notes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-compendium-${{ github.sha }}
          path: |
            output/pdf/*.pdf
            output/notes/*.md
            output/data/*.json
          retention-days: 14

      - name: Commit Updated Deduplication Cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/processed.json || true
          if git diff --staged --quiet; then
            echo "No dedup cache changes to commit."
          else
            git commit -m "chore(cache): update daily processed dedup records [skip ci]"
            git push
          fi

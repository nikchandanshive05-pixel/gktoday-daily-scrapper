name: GKToday Daily Scraper & Digest

on:
  schedule:
    - cron: "30 0 * * *"   # Runs daily at 06:00 AM IST (00:30 UTC)
  workflow_dispatch:
    inputs:
      max_days_old:
        description: "Number of days back to scrape (default: 2)"
        required: false
        default: "2"
      quiz_mode:
        description: "PDF generation mode: combined / separate / both / json-only"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - combined
          - separate
          - json-only
      hide_answers:
        description: "Hide answers in quiz PDF for student test mode (true/false)"
        required: false
        default: "false"

env:
  PYTHON_VERSION: "3.11"

jobs:
  scrape-and-deliver:
    name: Scrape GKToday & Deliver Digests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Processed History
        uses: actions/cache@v4
        with:
          path: output/processed.json
          key: gktoday-processed-${{ github.run_id }}
          restore-keys: gktoday-processed-

      - name: Run GKToday Scraper & Digest Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MAX_DAYS_OLD: ${{ github.event.inputs.max_days_old || '2' }}
          QUIZ_MODE: ${{ github.event.inputs.quiz_mode || 'both' }}
          HIDE_ANSWERS: ${{ github.event.inputs.hide_answers || 'false' }}
          OUTPUT_DIR: output
        run: python gktoday_scraper_v10.py

      - name: Upload Generated PDFs & Data Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gktoday-digests-${{ github.run_id }}
          path: |
            output/pdfs/*.pdf
            output/data/*.json
          retention-days: 14
